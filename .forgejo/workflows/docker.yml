name: Build and push to Forgejo Packages

on:
  push:
    branches:
      - managed-auth
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        type: string
        required: false
        default: 'manual'

jobs:
  docker:
    runs-on: office-server-amd64-ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 is built on this amd64 runner under QEMU emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Forgejo Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.xd003.cc
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_PAT }}

      # Image references must be lowercase; the repository is xd003/AIOStreams.
      # A push publishes the short commit SHA, a manual run the given tag.
      - name: Determine image and tag
        id: vars
        run: |
          echo "image=git.xd003.cc/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      # One multi-arch manifest (amd64 + arm64) per tag. arm64 runs emulated,
      # so its first build (ffprobe, native modules, the frontend) is slow; the
      # registry cache keeps every platform's ffprobe and dependency layers
      # between runs, and a cache failure never fails the build.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=registry,ref=${{ steps.vars.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.vars.outputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
